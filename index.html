<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- app no celular (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121019">
  <link rel="apple-touch-icon" href="icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quem cabe?">
  <title>Quem cabe na Câmara? – o jogo</title>
  <meta name="description" content="Um jogo com os dados reais da eleição de 2026: entre na disputa com um candidato de verdade e veja se dá para vencer a peneira das urnas.">
  <meta property="og:title" content="Quem cabe na Câmara? – o jogo">
  <meta property="og:description" content="18.842 candidaturas, 1.654 cadeiras. Jogue a campanha com um candidato real de 2026.">
  <meta property="og:image" content="https://ccarpenter-tech.github.io/quem-cabe-na-camara/previa.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="jogo.css?v=7">
</head>
<body>
  <ol id="fases" hidden aria-label="Fases do jogo"></ol>
  <main id="app">
    <div id="hud" hidden aria-live="polite"></div>
    <div id="tela"></div>
  </main>
  <noscript><p style="padding:40px">Este jogo precisa de JavaScript. Veja a versão em texto no <a href="dossie.html">dossiê</a>.</p></noscript>

  <script src="dados.js?v=8"></script>
  <script src="jogo-dados.js?v=5"></script>
  <script src="jogo-ui.js?v=3"></script>
  <script src="jogo.js?v=8"></script>
  <script>
    // app no celular: guarda os arquivos para abrir rápido e funcionar sem internet
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
    // botão "Baixar como app": o navegador avisa quando o site pode ser instalado (Android e Chrome/Edge no computador)
    window.PEDIDO_APP = null;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.PEDIDO_APP = e; window.dispatchEvent(new Event('app-instalavel')); });
    window.addEventListener('appinstalled', () => { window.PEDIDO_APP = null; window.dispatchEvent(new Event('app-instalavel')); });
  </script>
</body>
</html>
